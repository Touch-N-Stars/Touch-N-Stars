name: Claude PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-pr-review-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR number
        id: pr
        run: echo "number=${{ github.event.inputs.pr_number || github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      # Read-only copy of the proposed code. refs/pull/N/head works for both event types
      # and for pull requests opened from forks. Nothing in here is ever executed.
      - name: Checkout PR head (read-only)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          path: pr-head

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ steps.pr.outputs.number }} of the Touch-N-Stars repository as a strict senior frontend engineer.

            Project context:
            - Touch-N-Stars is a mobile-first Vue 3 + Vite web interface for controlling N.I.N.A (Nighttime Imaging 'N' Astronomy).
            - It communicates with N.I.N.A via the Advanced API (https://github.com/christian-photo/ninaAPI), typically on port 1888, API V2.
            - This is hardware-adjacent software: some actions can move real astronomical equipment, start exposures, or change device state. Be conservative and safety-aware.

            Gather context in this order before you judge anything:
            1. `gh pr view ${{ steps.pr.outputs.number }}` - what is this PR trying to achieve?
            2. `gh pr diff ${{ steps.pr.outputs.number }}` - the change itself.
            3. Read the project rule files. They define what "correct" means in this
               repository and they override your general Vue/JavaScript instincts:
               CLAUDE.md, docs/AGENT_GUIDELINES.md, CONTRIBUTING.md, HighLevelDesign.md.
               Use the checklists in .claude/skills/tns-review/SKILL.md as your review
               criteria - but ignore its instructions about spawning parallel agents,
               you are a single reviewer.
            4. Read whole files wherever the diff alone is not enough to judge a change,
               for example to check callers, existing helpers or established patterns.

            IMPORTANT - two working copies:
            - The working directory holds the target branch, i.e. the code WITHOUT this PR.
              Use it for the rule files above and for "how does the rest of the app do this".
            - ./pr-head holds the proposed code, i.e. WITH this PR applied. Use it to read
              changed files in full.
            - Never install dependencies, build, run tests, or execute any script from
              ./pr-head. Reading is the only permitted use.

            Review priorities:
            - Does the change actually do what the PR description promises?
            - Validate that user actions map to the correct N.I.N.A API calls.
            - Preserve safety and sequencing for equipment operations (no hidden behavior changes).
            - Flag regressions in connection/reconnection handling, status polling, and error messaging.
            - Apply the project-specific rules you just read. They cover traps that look
              perfectly fine in isolation (i18n keys for user-facing strings, the polling
              contract, NINA/PINS dual mode, Android/iOS/browser parity, the tns-* UI
              utilities, English code comments).
            - Focus on correctness, regressions, security, and test gaps.
            - Treat translation/i18n and formatting changes separately from functional behavior.
            - Do not repeat style-only findings already covered by lint/format CI gates unless they cause functional risk.

            Output rules:
            - Write in English.
            - At most 10 findings, most important first, grouped as Blocker / Major / Minor / Nit.
              Blocker and Major must be actionable.
            - Every finding needs a `path/file.vue:line` reference and a concrete failure
              scenario ("if the mount is parked and X happens, then Y"). If you cannot name
              one, drop the finding - speculative remarks are worse than silence.
            - Do not summarize the diff and do not praise the author. Finding nothing is a
              valid result: say "No blocking issues found" and stop.
            - Post your findings exactly once, with
              `gh pr comment ${{ steps.pr.outputs.number }} --edit-last --body "..."`.
              If that fails because there is no previous comment of yours, run the same
              command without --edit-last. Do not comment more than once.
          track_progress: false
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
